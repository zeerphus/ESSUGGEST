<div class="w-20 h-20 absolute -top-12 left-40 m-4 z-20 flex justify-center items-center rounded-xl bg-green-800 shadow-lg ">
  <img src="/assets/LOGO.png" alt="Logo" class="w-16 h-16">

    <div class="w-110 h-164 bg-white rounded-2xl shadow-2xl relative z-10">
        
        
        <h1 class="text-center  text-4xl font-poppins font-black  mt-20 ">Create Account</h1>
        <p class="text-center text-sm opacity-50  mb-6 font-thin italic font-jakarta  ">Sign up for a new account</p>

        <form class="flex justify-center items-center flex-col space-y-1 "onsubmit="SignUp(event)">
            
           <div class="w-90 mb-2.5">
            <label for="" class=" px-3 font-dm">Email</label>
            <input type="email" id="email"
                    placeholder="JuanDelaCruz@gmail.com"
                    class="border border-gray-200 bg-gray-100 w-full py-2 rounded-md px-3 focus:ring-green-400 focus:outline-none focus:ring-2 font-dm text-sm"  >
           </div>

           
           <div class="w-90">
            <label for="" class=" px-3 font-dm ">Password</label>
            <div class="relative">
             <input type="password" id="password"
                    placeholder="•••••••••••••"
                    class="border border-gray-200 bg-gray-100 w-full py-2 rounded-md px-3 focus:ring-green-400 focus:outline-none focus:ring-2 font-dm  mb-1  text-sm">

                    
                    
                    <svg id="eyeconS" onclick="eye(event)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer  text-gray-500">
  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
</svg>
            </div>


            <ul id="reqs" class="mb-4 space-y-1.5 font-dm">
          <li data-rule="len" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            At least 8 characters
          </li>
          <li data-rule="upper" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            One upper case letter <span class="italic text-gray-300">(A-Z)</span>
          </li>
          <li data-rule="lower" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            One lower case letter <span class="italic text-gray-300">(a-z)</span>
          </li>
          <li data-rule="num" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            One number <span class="italic text-gray-300">(0-9)</span>
          </li>
          <li data-rule="special" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            One special character <span class="italic text-gray-300">(!@#$%^&*()-+...)</span>
          </li>
        </ul>

            <div class="w-90 mb-2.5">
            <label for="" class=" px-3 font-dm ">Confirm Password</label>
            <div class="relative">
             <input type="password" id="password2"
                    placeholder="•••••••••••••"
                    class="border border-gray-200 bg-gray-100 w-full py-2 rounded-md px-3 focus:ring-green-400 focus:outline-none focus:ring-2 font-dm  mb-1  text-sm">

                    
                    
                    <svg id="eyecon" onclick="eye(event)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500">
  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
</svg>
            </div>
           </div>

           
           <p id="message" class=" font-dm font-light h-5 text-center" ></p>

           <div  class=" flex justify-center items-center ">
          <!-- flex + items-center + justify-center keep the loader centered in the button -->
          <button id="submit" type="submit" class="flex items-center justify-center bg-green-600 text-white w-90 h-10 rounded-md hover:bg-green-700 disabled:cursor-not-allowed disabled:opacity-90 transition duration-300 font-poppins  text-md font-bold ">
            Sign up
          </button>
          </div>
          <p class="text-center font-dm  text-sm mb-10 ">
            Already have an account?

            <a class="text-blue-500" href="../auth/LogIn.html" >Log in here.</a>
          </p>


          <p class="text-center text-sm font-dm ">© 2026</p>
            
        </form>
    </div>
    </div>


  

    <!-- ldrs: registers the <l-mirage> loader used by SignUp.js -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/ldrs/dist/auto/mirage.js"></script>
