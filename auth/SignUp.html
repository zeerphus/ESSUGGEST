    <!-- Logo badge: centered on the card instead of a fixed left-40 offset -->
    <div class="w-20 h-20 absolute -top-8 left-1/2 -translate-x-1/2 z-20 flex justify-center items-center rounded-xl bg-green-800 shadow-lg">
      <img src="/assets/LOGO.png" alt="Logo" class="w-16 h-16">
    </div>

    <!-- Card: fluid width, height follows the content on mobile -->
    <div class="w-full h-auto sm:min-h-184 pb-8 bg-white rounded-2xl shadow-2xl relative z-10">

        <h1 class="text-center text-3xl sm:text-4xl font-poppins font-black mt-16 sm:mt-20">Create Account</h1>
        <p class="text-center text-sm opacity-50 mb-6 font-thin italic font-jakarta">Sign up for a new account</p>

        <!-- Form is full width with side padding; children use w-full instead of fixed w-90 -->
        <form class="flex flex-col items-stretch space-y-1 w-full px-6 sm:px-10" onsubmit="SignUp(event)">

           <div class="w-full mb-2.5">
            <label for="email" class="px-3 font-dm">Email</label>
            <!-- text-base on mobile stops iOS from zooming the page on focus -->
            <input type="email" id="email" autocomplete="email"
                    placeholder="JuanDelaCruz@gmail.com"
                    class="border border-gray-200 bg-gray-100 w-full py-2.5 sm:py-2 rounded-md px-3 focus:ring-green-400 focus:outline-none focus:ring-2 font-dm text-base sm:text-sm">
           </div>


           <div class="w-full">
            <label for="password" class="px-3 font-dm">Password</label>
            <div class="relative">
             <input type="password" id="password" autocomplete="new-password"
                    placeholder="•••••••••••••"
                    class="border border-gray-200 bg-gray-100 w-full py-2.5 sm:py-2 rounded-md pl-3 pr-10 focus:ring-green-400 focus:outline-none focus:ring-2 font-dm mb-4 text-base sm:text-sm">

                    <!-- box-content + p-2 gives a ~32px tap area; icon stays in the same spot -->
                    <svg id="eyeconS" onclick="eye(event)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="solar solar-eye-line-duotone size-4 box-content p-2 absolute right-1 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500"><path d="M3.27489 15.2957C2.42496 14.1915 2 13.6394 2 12C2 10.3606 2.42496 9.80853 3.27489 8.70433C4.97196 6.49956 7.81811 4 12 4C16.1819 4 19.028 6.49956 20.7251 8.70433C21.575 9.80853 22 10.3606 22 12C22 13.6394 21.575 14.1915 20.7251 15.2957C19.028 17.5004 16.1819 20 12 20C7.81811 20 4.97196 17.5004 3.27489 15.2957Z" stroke="currentColor" stroke-linecap="round" style="color: var(--solar-secondary-color, currentColor); opacity: var(--solar-secondary-opacity, 0.5)"/><path d="M15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z" stroke="currentColor" stroke-linecap="round"/></svg>
            </div>


            <ul id="reqs" class="mb-4 space-y-1.5 font-dm">
          <li data-rule="len" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            At least 8 characters
          </li>
          <li data-rule="upper" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            One upper case letter <span class="italic text-gray-300">(A-Z)</span>
          </li>
          <li data-rule="lower" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            One lower case letter <span class="italic text-gray-300">(a-z)</span>
          </li>
          <li data-rule="num" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            One number <span class="italic text-gray-300">(0-9)</span>
          </li>
          <li data-rule="special" class="flex items-center gap-2 text-xs text-gray-400">
            <span class="req-dot w-2 h-2 rounded-full border border-gray-400 shrink-0"></span>
            One special character <span class="italic text-gray-300">(!@#$%^&*()-+...)</span>
          </li>
        </ul>
           </div>

            <div class="w-full mb-2.5">
            <label for="password2" class="px-3 font-dm">Confirm Password</label>
            <div class="relative">
             <input type="password" id="password2" autocomplete="new-password"
                    placeholder="•••••••••••••"
                    class="border border-gray-200 bg-gray-100 w-full py-2.5 sm:py-2 rounded-md pl-3 pr-10 focus:ring-green-400 focus:outline-none focus:ring-2 font-dm mb-1 text-base sm:text-sm">

                    <svg id="eyecon" onclick="eye(event)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="solar solar-eye-line-duotone size-4 box-content p-2 absolute right-1 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500"><path d="M3.27489 15.2957C2.42496 14.1915 2 13.6394 2 12C2 10.3606 2.42496 9.80853 3.27489 8.70433C4.97196 6.49956 7.81811 4 12 4C16.1819 4 19.028 6.49956 20.7251 8.70433C21.575 9.80853 22 10.3606 22 12C22 13.6394 21.575 14.1915 20.7251 15.2957C19.028 17.5004 16.1819 20 12 20C7.81811 20 4.97196 17.5004 3.27489 15.2957Z" stroke="currentColor" stroke-linecap="round" style="color: var(--solar-secondary-color, currentColor); opacity: var(--solar-secondary-opacity, 0.5)"/><path d="M15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z" stroke="currentColor" stroke-linecap="round"/></svg>
            </div>
           </div>


           <!-- min-h instead of fixed h so long error messages wrap instead of overlapping -->
           <p id="message" class="font-dm font-light min-h-5 text-sm text-center"></p>

           <div class="flex justify-center items-center">
          <!-- flex + items-center + justify-center keep the loader centered in the button -->
          <button id="submit" type="submit" class="flex items-center justify-center bg-green-600 text-white w-full h-11 sm:h-10 rounded-md hover:bg-green-700 disabled:cursor-not-allowed disabled:opacity-90 transition duration-300 font-dm text-md font-bold">
            Sign up
          </button>
          </div>

          <!-- "or" divider -->
          <div class="flex items-center gap-3 w-full my-2.5" role="separator" aria-label="or">
            <span class="h-px flex-1 bg-gray-300"></span>
            <span class="text-xs font-dm text-gray-400">or</span>
            <span class="h-px flex-1 bg-gray-300"></span>
          </div>

          <!-- CONTINUE WITH GOOGLE (UI only — not wired up yet).
               type="button" so it never submits the sign up form. -->
          <button
            id="googleBtn"
            type="button"
            class="flex items-center justify-center gap-2.5 bg-white text-gray-700 w-full h-11 sm:h-10 rounded-md border border-gray-300 hover:bg-gray-50 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-90 transition duration-300 font-dm text-sm font-medium cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-green-400"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="size-5 shrink-0" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </button>


          <p class="text-center font-dm text-xs mb-6 opacity-70 mt-2.5">
            Already have an account?

            <a class="text-blue-500" href="../auth/LogIn.html">Log in here.</a>
          </p>


          <p class="text-center text-xs font-dm text-black/50">© 2026</p>

        </form>
    </div>
    </div>


    <!-- ldrs: registers the <l-mirage> loader used by SignUp.js -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/ldrs/dist/auto/mirage.js"></script>
    <script type="module" src="../auth/SignUp.js" defer></script>

</body>
</html>
